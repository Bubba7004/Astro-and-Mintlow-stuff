<!DOCTYPE html>
<html>

<!-- Ultimate Game Stash file-->
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->

<head>
	<script src="//www.google.com/jsapi"></script>
	<script>
		window.parent.maeExportApis_();
	</script>

	<style>
		body {
			overflow: hidden;
			background: #000000;
			margin-top: 0;
			margin-left: 0;
			color: #000000;
		}

		#startButton {
			display: block;
			width: 160px;
			height: 40px;
			background-color: #4CAF50;
			color: white;
			text-align: center;
			text-decoration: none;
			font-size: 16px;
			margin: 20px auto;
			padding: 10px 20px;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-family: 'Press Start 2P', cursive;
			box-shadow: 0px 0px 10px 2px #000000;
		}
	</style>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
</head>

<body>
	<div style="width: 100vw; height: 100vh;max-width:100%">
		<div id="game" style="display: none;"></div>
		<button id="startButton">PLAY</button>
	</div>
	<script>
		document.getElementById("game").style.display = "none";

		const BASE = "https://cdn.jsdelivr.net/gh/Bubba7004/Astro-and-Mintlow-stuff@main/SuperRemix/";
		const PARTS = ["smash-remix-aa", "smash-remix-ab", "smash-remix-ac", "smash-remix-ad"];
		const DB_NAME = "rom-cache";
		const STORE = "chunks";
		const KEY = "smash-remix-2.0.1";

		function openDB() {
			return new Promise((res, rej) => {
				const req = indexedDB.open(DB_NAME, 1);
				req.onupgradeneeded = () => req.result.createObjectStore(STORE);
				req.onsuccess = () => res(req.result);
				req.onerror = () => rej(req.error);
			});
		}

		function getChunk(db, key) {
			return new Promise((res, rej) => {
				const tx = db.transaction(STORE, "readonly");
				const req = tx.objectStore(STORE).get(key);
				req.onsuccess = () => res(req.result);
				req.onerror = () => rej(req.error);
			});
		}

		function putChunk(db, key, buf) {
			return new Promise((res, rej) => {
				const tx = db.transaction(STORE, "readwrite");
				tx.objectStore(STORE).put(buf, key);
				tx.oncomplete = () => res();
				tx.onerror = () => rej(tx.error);
			});
		}

		async function startGame() {
			document.getElementById("game").style.display = "block";
			document.getElementById("startButton").style.display = "none";

			const db = await openDB();
			const meta = await getChunk(db, KEY + "_meta");
			let chunks;

			if (meta === PARTS.length) {
				// Load from cache
				chunks = [];
				for (let i = 0; i < meta; i++) {
					chunks.push(await getChunk(db, KEY + "_" + i));
				}
			} else {
				// Fetch each part from jsDelivr (each under 20 MB)
				chunks = await Promise.all(
					PARTS.map(p => fetch(BASE + p).then(r => {
						if (!r.ok) throw new Error("Failed to fetch " + p + ": " + r.status);
						return r.arrayBuffer();
					}))
				);
				for (let i = 0; i < chunks.length; i++) {
					await putChunk(db, KEY + "_" + i, chunks[i]);
				}
				await putChunk(db, KEY + "_meta", PARTS.length);
			}

			const blob = new Blob(chunks, { type: "application/octet-stream" });
			EJS_gameUrl = URL.createObjectURL(blob);
			EJS_player = "#game";
			EJS_core = "n64";
			EJS_color = "#000000";
			EJS_startOnLoaded = true;
			EJS_pathtodata = "https://cdn.jsdelivr.net/gh/Bubba7004/emul@main/";
			EJS_defaultOptions = { vsync: "disabled" };

			var script = document.createElement("script");
			script.src = "https://cdn.jsdelivr.net/gh/Bubba7004/emul@main/loader.js";
			document.body.appendChild(script);
		}

		document.getElementById("startButton").addEventListener("click", startGame);
	</script>
</body>
</html>
